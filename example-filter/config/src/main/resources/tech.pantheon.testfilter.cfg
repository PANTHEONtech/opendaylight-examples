################################################################################
# TestFilter / TestRealm configuration
#
# mode: authentication decision mode of TestRealm
#   allow-all  - any request carrying an Authorization header authenticates,
#                the user is granted a single role equal to the username
#   reject-all - every Authorization-header authentication attempt is
#                rejected with 401
# An unrecognized value falls back to reject-all.
################################################################################
mode = allow-all
